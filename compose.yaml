services:
  cuecare:
    image: cuecare:${IMAGE_TAG:-task11}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-cuecare-task11}
    ports:
      - "${CUECARE_PORT:-8082}:5000"
    environment:
      PORT: "5000"
      DB_PATH: /app/data/cuecare.db
    volumes:
      - cuecare-data:/app/data
    restart: unless-stopped

volumes:
  cuecare-data:
